# Import the Unity project into this repo. (v2)
# v2 change: the download step no longer relies on `gdown --fuzzy`
# (v1 run failed there). It echoes the pasted URL into the log, pulls
# the Drive file ID out of it with a regex, and downloads via the
# canonical uc?id= form. The downloaded file is size/type checked
# before anything else runs.
# Commits/pushes happen in TWO chunks using the workflow's own
# GITHUB_TOKEN: push 1 = everything except Assets/Scripts;
# push 2 = Assets/Scripts + Packages + ProjectSettings + .gitignore.
name: Import project
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct-download URL of the project zip"
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Download project zip
        run: |
          echo "Received zip_url: ${{ inputs.zip_url }}"
          pip install --quiet "gdown==5.2.0"
          FID=$(echo "${{ inputs.zip_url }}" | grep -oE '[A-Za-z0-9_-]{25,}' | sort -u | awk '{ if (length($0) > length(m)) m = $0 } END { print m }')
          echo "Extracted Drive file ID: $FID"
          gdown "https://drive.google.com/uc?id=${FID}" -O project.zip
          ls -la project.zip
          python3 -c "
          import os, zipfile
          s = os.path.getsize('project.zip')
          assert s > 900_000_000, f'zip too small: {s} bytes'
          assert zipfile.is_zipfile('project.zip'), 'downloaded file is not a zip'
          print(f'zip verified: {s} bytes')
          "
      - name: Unpack at repo root
        run: |
          unzip -q project.zip -x ".github/*"
          rm project.zip
          ls
      - name: Commit + push in chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 2147483648
          git add -A -- . ':!Assets/Scripts'
          git commit -m "Import Unity project (part 1: assets)"
          git push
          git add -A
          git commit -m "Import Unity project (part 2: scripts + settings)"
          git push
