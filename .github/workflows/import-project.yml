# Import the Unity project into this repo.
# Downloads a zip of the staged project (Assets + Packages +
# ProjectSettings + .gitignore) from a direct URL, unpacks it at the
# repo root, and commits/pushes it back in TWO chunks using the
# workflow's own GITHUB_TOKEN. No personal token involved.
# Chunking: push 1 = everything under Assets except Assets/Scripts;
# push 2 = Assets/Scripts + Packages + ProjectSettings + .gitignore.
# Each push stays well under GitHub's 2 GB push cap.
name: Import project
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct-download URL of the project zip"
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Download project zip
        run: |
          pip install --quiet gdown
          gdown --fuzzy "${{ inputs.zip_url }}" -O project.zip
          ls -la project.zip
      - name: Unpack at repo root
        run: |
          unzip -q project.zip -x ".github/*"
          rm project.zip
          ls
      - name: Commit + push in chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!Assets/Scripts'
          git commit -m "Import Unity project (part 1: assets)"
          git push
          git add -A
          git commit -m "Import Unity project (part 2: scripts + settings)"
          git push
